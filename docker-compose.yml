# Три сервіси (NFR-012): сервер пошуку, Ollama з автозавантаженням моделі, веб-контейнер (AD-07).
# OLLAMA_MODEL — модель Ollama, дефолт за ADR-005 (OQ-13 закрито); можна перевизначити.
services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  ollama-model:
    image: ollama/ollama
    entrypoint: ["/bin/sh", "/provision/ollama-provision.sh"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b}  # ADR-005 (OQ-13)
    volumes:
      - ./docker/ollama-provision.sh:/provision/ollama-provision.sh:ro
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    env_file:
      - path: .env
        required: false  # значення з .env передаються в сервер; environment нижче має пріоритет
    environment:
      SERVER_PORT: "8080"
      DATASET_DIR: /data/docs
      INDEX_ON_START: ${INDEX_ON_START:-true}  # індекс будується при старті контейнера
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b}  # ADR-005 (OQ-13)
    volumes:
      - ${DATASET_HOST_DIR:-./dataset}:/data/docs:ro  # датасет: OQ-01, ще не затверджено
    depends_on:
      ollama:
        condition: service_healthy
      ollama-model:
        condition: service_completed_successfully

  web:
    image: nginx:alpine
    volumes:
      - ./web/static:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server

  # Reverse proxy перед веб-контейнером; єдина опублікована точка входу (порт 8081 на хості).
  traefik:
    image: traefik:v3.6
    command: ["--configFile=/etc/traefik/traefik.yml"]
    ports:
      - "8081:80"
    volumes:
      - ./docker/traefik:/etc/traefik:ro
    depends_on:
      - web

volumes:
  ollama-data:
