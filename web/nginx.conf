# Проксі для веб-контейнера (AD-07): /api і /ws/search йдуть на сервер пошуку.
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    error_page 404 /404.html;

    # Заголовки безпеки для статики. connect-src: ws/wss потрібні для /ws/search.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain application/json;
    gzip_min_length 512;

    location /api/ {
        proxy_pass http://server:8080;
        # POST /api/index синхронний і може тривати довго (великий датасет); 60 с за замовчуванням замало.
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location /ws/search {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        try_files $uri $uri/ =404;
        # Файли без хешів у назві: перевіряти оновлення при кожному запиті.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    }
}
